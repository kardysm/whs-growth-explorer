<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>404 Strona nie istnieje</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,900&amp;subset=latin-ext" rel="stylesheet">
        <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('/images/http_responses/404/background.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position-x: 67%;
            min-height: 100vh;
            width: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lato', sans-serif;
            padding: 20px;
        }

        .error404 {
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-left: auto;
            margin-right: auto;
            width: auto;
        }

        .logo {
            display: block;
            height: 100%;
            width: auto;
            margin-left: auto;
            margin-right: auto;
        }

        .position-items {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
        }

        .item404 {
            width: 100%;
        }

        .info {
            font-size: 8vw;
            color: #ffffff;
            font-weight: 900;
            text-align: center;

        }

        .description {
            font-size: 4.5vw;
            font-weight: 300;
            color: #ffffff;
            text-align: center;
            line-height: 1.54;

        }

        .error404 a {
            display: flex;
            font-size: 13px;
            color: #9182bc;
            font-weight: 700;
            text-align: right;
            padding: 10px 23px;
            border-radius: 22.5px;
            background-color: #ffffff;
            color: #9182bc;
            margin-left: auto;
            margin-right: auto;
            text-decoration: none;
            margin-top: 15px;
            line-height: 13px;
        }

        .error404 a img {
            width: 18px;
            height: 18px;
            margin-left: 15px;
        }

        @media only screen and (min-width: 600px) {

            body {
                height: auto;
            }

            .error404 {
                width: auto;
            }

            .error404 a {
                font-size: 16px;
            }

            .item404 {
                width: auto;
            }

            .info {
                font-size: 40px;
                margin-bottom: 30px;
            }

            .description {
                font-size: 26px;
            }

            .position-items {
                margin: 40px 0;
            }

        }

        @media only screen and (min-width: 1200px) {
            .error404 {
                margin-right: 500px;
            }

            body {
                display: block;
            }
        }
    </style>
    </head>
    <body>
        <section class="error404">
            <img class="logo" src="https://akademianutricia.pl/images/http_responses/404/logo.svg?1790933011" alt="logo nutricia">
            <div class="position-items">
                <img class="item404" src="https://akademianutricia.pl/images/http_responses/404/404.png?1790933011" alt="404 logo">
            </div>
            <span class="info">Ta strona nie istnieje.</span>
            <p class="description">Jeśli masz pytania skontaktuj się z naszym <br> serwisem konsumenckim<strong> (+48 22 55 00 155)</strong><br>lub wróć na stronę główną.</p>
            <a href="https://akademianutricia.pl">Zapraszamy Cię na stronę główną
                <img src="https://akademianutricia.pl/images/http_responses/404/play-button.svg?1790933011" alt="play button">
            </a>
        </section>
    </body>
</html>
