<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WHS Feeding &amp; Growth Explorer</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%23613dc1"/><path d="M6 22c5 0 6-12 10-12s5 12 10 12" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round"/></svg>' />
    <meta name="description" content="Interaktywne narzędzie edukacyjne: żywienie i wzrastanie dzieci z zespołem Wolfa-Hirschhorna (WHS). Kalkulator szacunkowy, wykresy, materiały źródłowe." />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Ta strona wymaga JavaScript. / This site requires JavaScript.</noscript>
    <script type="module" src="/src/ui/main.ts"></script>
    <!-- GitHub Pages branch-mode fallback: when the site is served from the repository root
         (Pages source = "Deploy from a branch"), the raw TypeScript entry above cannot execute
         (served with a non-JS MIME type), so the prebuilt bundle committed under ./site/ is
         loaded instead. The bundle is refreshed automatically by `npm run build`
         (scripts/sync_site.mjs). In dev and in Actions-mode deployments the app mounts
         normally, #app is non-empty, and nothing loads here. -->
    <script>
      window.addEventListener("load", function () {
        window.setTimeout(function () {
          var appEl = document.getElementById("app");
          if (!appEl || appEl.childNodes.length > 0) return;
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "./site/app.css";
          document.head.appendChild(link);
          var s = document.createElement("script");
          s.type = "module";
          s.src = "./site/app.js";
          s.onerror = function () {
            appEl.innerHTML =
              '<p style="font:16px/1.5 system-ui;padding:24px">Nie udało się załadować aplikacji. Odśwież stronę. / Could not load the app. Please reload.</p>';
          };
          document.body.appendChild(s);
        }, 400);
      });
    </script>
  </body>
</html>
